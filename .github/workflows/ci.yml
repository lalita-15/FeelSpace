
name: FeelSpace CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run FeelSpace Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: feelspace

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        env:
          SECRET_KEY: test-secret-key
        run: |
          python -m pytest tests/ -v

  build-and-deploy:
    name: Build, Push to ECR and Deploy to EKS
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TEMPORARY: Debug GitHub OIDC claims
      - name: Debug OIDC Claims
        shell: bash
        run: |
          set -euo pipefail

          curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
          python -c '
          import sys
          import json
          import base64

          token = sys.stdin.read().strip()
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          data = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print(json.dumps({
              "sub": data.get("sub"),
              "aud": data.get("aud"),
              "repository": data.get("repository"),
              "repository_id": data.get("repository_id"),
              "repository_owner": data.get("repository_owner"),
              "repository_owner_id": data.get("repository_owner_id"),
              "ref": data.get("ref")
          }, indent=2))
          '

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: feelspace
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./feelspace
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION }} \
            --name FeelSpace-EKS-Cluster

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/feelspace-app \
            feelspace=$ECR_REGISTRY/feelspace:$IMAGE_TAG \
            -n feelspace

          kubectl rollout status deployment/feelspace-app \
            -n feelspace \
            --timeout=180s
